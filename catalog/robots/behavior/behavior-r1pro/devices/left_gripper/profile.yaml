name: left_gripper
runtime:
  domain_id: 0
  observation: joint_state
  nodes: []
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured mean finger opening as a normalized grip joint position, stamped
      at acquisition.
    transport: topic
    direction: output
    endpoint: /left_gripper/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  target:
    description: Grip joint position (data), a normalized opening, between closed and open.
      It persists until replaced or stopped; one out of range is refused, which the world's
      next wait reply reports.
    transport: topic
    direction: input
    endpoint: /left_gripper/target
    type: std_msgs/msg/Float64
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  stop:
    description: Keep the commanded grip, so a held object stays gripped; before the first
      command, hold the measured opening.
    transport: service
    direction: input
    endpoint: /left_gripper/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: true
