name: arm
runtime:
  domain_id: 0
  nodes: []
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured joint positions and velocities in URDF units, stamped at acquisition.
    transport: topic
    direction: output
    endpoint: /arm/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  pose_target:
    description: 'Trajectory of flange poses in arm/base: joint_names [flange] and one transform per point (metres, unit quaternion xyzw), with strictly increasing time_from_start ending within 120 s. It starts on receipt, or at a nonzero header stamp not in the past, runs from the current target and replaces the active command. An operational-space controller tracks it, by at most 5 cm and 0.5 rad per axis every 0.05 s, and may stop short of a pose. A malformed one is refused, which the world''s next wait reply reports.'
    transport: topic
    direction: input
    endpoint: /arm/pose_target
    type: trajectory_msgs/msg/MultiDOFJointTrajectory
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  pose_state:
    description: Measured flange pose in arm/base, stamped with joint_state.
    transport: topic
    direction: output
    endpoint: /arm/pose_state
    type: sensor_msgs/msg/MultiDOFJointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  stop:
    description: Stop motion and hold the measured flange pose.
    transport: service
    direction: input
    endpoint: /arm/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
