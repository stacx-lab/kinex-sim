name: base
runtime:
  domain_id: 0
  observation: odometry
  nodes: []
  ready_timeout_s: 30
operations:
  velocity:
    description: Body velocity in base/base axes, in the units and bounds of the profile's velocity; other axes stay zero. The body follows the latest twist and stops 0.5 s of world time after the last, so re-send to keep moving. One out of bounds is refused, which the world's next wait reply reports.
    transport: topic
    direction: input
    endpoint: /base/velocity
    type: geometry_msgs/msg/Twist
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  odometry:
    description: Measured body twist in base/base (m/s, rad/s) and planar pose in base/odom, the body frame where it started; never a global pose.
    transport: topic
    direction: output
    endpoint: /base/odometry
    type: nav_msgs/msg/Odometry
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  stop:
    description: Command zero velocity.
    transport: service
    direction: input
    endpoint: /base/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: true
meta:
  created_at: '2026-10-24T00:00:00Z'
  updated_at: '2026-10-24T00:00:00Z'
type: locomotion
description: Omron holonomic mobile base. Full-scale velocity is 1 m/s and 1.5 rad/s. Its base frame is the chassis origin, 21 cm ahead of the yaw axis.
source: introspected
calibrated_at: null
method: introspection
velocity:
  units: normalized
  axes:
    vx:
      min: -1.0
      max: 1.0
    vy:
      min: -1.0
      max: 1.0
    wz:
      min: -1.0
      max: 1.0
posture: null
modes:
  drive:
    description: Drives on velocity commands.
    accepts:
    - velocity
    transitions: []
limits: strict
stop:
  behavior: halt
  affected_devices:
  - base
frames:
  base:
    parent: null
    translation_m: null
    rotation_xyzw: null
