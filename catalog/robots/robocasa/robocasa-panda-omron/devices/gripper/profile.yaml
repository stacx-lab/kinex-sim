name: gripper
runtime:
  domain_id: 0
  observation: joint_state
  nodes: []
  ready_timeout_s: 30
operations:
  joint_state:
    description: The applied grip command, not a measured opening, stamped at acquisition.
    transport: topic
    direction: output
    endpoint: /gripper/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  target:
    description: Grip joint position (data), a normalized command, between closed and open. The applied command moves 0.2 toward it every 0.05 s. It persists until replaced or stopped; one out of range is refused, which the world's next wait reply reports.
    transport: topic
    direction: input
    endpoint: /gripper/target
    type: std_msgs/msg/Float64
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  stop:
    description: Keep the commanded grip, so a held object stays gripped; before the first command, hold the measured opening.
    transport: service
    direction: input
    endpoint: /gripper/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: true
meta:
  created_at: '2026-10-24T00:00:00Z'
  updated_at: '2026-10-24T00:00:00Z'
type: gripper
description: Panda parallel two-finger gripper. Fingers close along the base x axis. The grip joint is the applied command, not a measured opening, so fingers stalled on an object do not show in it.
source: introspected
calibrated_at: null
method: introspection
stop:
  behavior: hold
  affected_devices:
  - gripper
frames:
  base:
    translation_m:
    - 0.0
    - 0.0
    - 0.0
    rotation_xyzw:
    - 0.0
    - 0.0
    - -0.707106781187
    - 0.707106781187
    parent: arm:flange
  tcp:
    translation_m:
    - 0.0
    - 0.0
    - 0.097
    rotation_xyzw:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
    parent: gripper:base
model:
  format: urdf
  path: gripper.urdf
  base_link: base_link
grip:
  joint: gripper
  open: -1.0
  closed: 1.0
