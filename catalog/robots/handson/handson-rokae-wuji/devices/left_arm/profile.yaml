type: joint
description: 'ROKAE AR5 seven-joint left arm of the HandsOn station. Geometry is the sibling
  arm.urdf with palm (left_palm_link, the pose HandsOn''s EEF52 actions command) as the tip
  link; measured links are on TF as left_arm/<link>, and helpers.joint_model(''left_arm'')
  computes FK/IK from it. Commands are palm poses, which HandsOn''s own arm IK executes with
  the task''s palm limits, guards and drives; an arm not yet commanded holds its posture.
  The single-arm tasks eval_comb01, eval_gen01, eval_gen03, eval_gen06, eval_gen07 hold the
  left arm and hand at home: their workspaces declare no commands for them.'
