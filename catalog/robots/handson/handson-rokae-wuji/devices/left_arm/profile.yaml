name: left_arm
runtime:
  domain_id: 0
  nodes:
  - entry: links.py
    factory: create
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured positions of joint1_left, joint2_left, joint3_left, joint4_left,
      joint5_left, joint6_left, joint7_left in radians with velocities and the world-clock
      acquisition stamp; do not infer motion completion from a sent command.
    transport: topic
    direction: output
    endpoint: /left_arm/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  pose_target:
    description: 'Trajectory of palm poses in left_arm/base: header.frame_id left_arm/base,
      joint_names [palm] and one transform per point, translation in metres and a unit quaternion
      (xyzw), timed from receipt by strictly increasing time_from_start and finishing within
      120 seconds; velocities and accelerations must be empty. A zero header stamp selects
      now; a nonzero stamp must not start in the past. Poses are absolute, interpolated at
      the native control period (positions linearly, rotations by slerp) from the held target,
      or from the measured palm before the first command. HandsOn''s own arm IK (damped least
      squares, one iteration per step from the measured joints) and the task''s palm limits
      execute them, so a pose may be reached only in part or over several steps. Replacement
      clears pending references; invalid trajectories are ignored, so verify the measured
      palm on TF.'
    transport: topic
    direction: input
    endpoint: /left_arm/pose_target
    type: trajectory_msgs/msg/MultiDOFJointTrajectory
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  pose_state:
    description: 'Measured palm pose in left_arm/base (joint_names [palm]), with the world-clock
      acquisition stamp of joint_state: the pose TF gives left_arm/palm at that stamp.'
    transport: topic
    direction: output
    endpoint: /left_arm/pose_state
    type: sensor_msgs/msg/MultiDOFJointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  stop:
    description: Stop arm motion and hold the measured posture.
    transport: service
    direction: input
    endpoint: /left_arm/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: false
