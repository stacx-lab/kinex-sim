name: world
runtime:
  domain_id: 0
  observation: now
  nodes: []
  ready_timeout_s: 30
operations:
  now:
    description: 'World time, time_s, and the time budget in seconds of world time: used_s spent of max_s allowed. Without a budget both are NaN; without a limit max_s is inf.'
    transport: service
    direction: input
    endpoint: /world/now
    type: custom_interfaces/srv/Now
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  wait:
    description: 'Wait seconds of world time: the reply gives time_s, the world time reached. A world that executes goals ends the wait when one ends, and names it in ended. One wait at a time: a second is rejected. A command a device refused since the previous reply ends the wait at once with success false; message names it and why. Once the episode has ended, a wait with seconds left fails and message says why.'
    transport: service
    direction: input
    endpoint: /world/wait
    type: custom_interfaces/srv/Wait
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 120
  stop:
    description: Cancel the pending wait.
    transport: service
    direction: input
    endpoint: /world/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
