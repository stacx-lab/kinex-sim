  base:
    translation_m:
    - 0
    - 0
    - 0
    rotation_xyzw:
    - 0
    - 0
    - -0.707106781187
    - 0.707106781187
    parent: arm:flange
  tcp:
    translation_m:
    - 0
    - 0
    - 0.097
    rotation_xyzw:
    - 0
    - 0
    - 0
    - 1
    parent: gripper:base
model:
  format: urdf
  path: gripper.urdf
  base_link: base_link
grip:
  joint: finger_joint1
  open: 0.04
  closed: 0.0
