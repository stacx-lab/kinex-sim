name: gripper
runtime:
  domain_id: 0
  nodes: []
  ready_timeout_s: 30
  observation: joint_state
operations:
  joint_state:
    description: Measured grip joint position, in metres, stamped at acquisition.
    transport: topic
    direction: output
    endpoint: /gripper/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  target:
    description: Grip joint position (data), in metres, between closed and open. Open and closed are reached reliably; intermediate targets oscillate by a few millimetres. It persists until replaced or stopped; one out of range is refused, which the world's next wait reply reports.
    transport: topic
    direction: input
    endpoint: /gripper/target
    type: std_msgs/msg/Float64
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  stop:
    description: Keep the commanded grip, so a held object stays gripped; before the first command, hold the measured opening.
    transport: service
    direction: input
    endpoint: /gripper/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: true
meta:
  created_at: '2026-10-19T00:00:00Z'
  updated_at: '2026-10-20T17:24:01.455Z'
type: gripper
description: Panda parallel two-finger gripper. Fingers close along the base x axis; the URDF pad links mark the 16 by 16 mm inner pad faces. The inner pad gap is 2 * finger_joint1 - 1 mm.
source: introspected
calibrated_at: null
method: introspection
stop:
  behavior: hold
  affected_devices:
  - gripper
