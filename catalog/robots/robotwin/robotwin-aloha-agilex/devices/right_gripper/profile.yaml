name: right_gripper
runtime:
  domain_id: 0
  observation: joint_state
  nodes: []
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured grip joint position, a normalized opening, stamped at acquisition.
    transport: topic
    direction: output
    endpoint: /right_gripper/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  target:
    description: Grip joint position (data), a normalized opening, between closed and open.
      It persists until replaced or stopped; one out of range is refused, which the world's
      next wait reply reports.
    transport: topic
    direction: input
    endpoint: /right_gripper/target
    type: std_msgs/msg/Float64
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  stop:
    description: Keep the commanded grip, so a held object stays gripped; before the first
      command, hold the measured opening.
    transport: service
    direction: input
    endpoint: /right_gripper/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: true
meta:
  created_at: '2026-10-24T00:00:00Z'
  updated_at: '2026-10-24T00:00:00Z'
type: gripper
description: ALOHA AgileX right parallel two-finger gripper. A closed target squeezes past
  the finger stop. The TCP approaches along +x.
source: introspected
calibrated_at: null
method: introspection
stop:
  behavior: hold
  affected_devices:
  - right_gripper
frames:
  base:
    translation_m:
    - 0.0
    - 0.0
    - 0.0
    rotation_xyzw:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
    parent: right_arm:flange
  tcp:
    translation_m:
    - 0.119999992883
    - -9.757e-09
    - -7.153e-09
    rotation_xyzw:
    - 1.0e-12
    - 2.9802e-08
    - -6.4393e-08
    - 0.999999973161
    parent: right_gripper:base
model:
  format: urdf
  path: gripper.urdf
  base_link: base_link
grip:
  joint: right_gripper
  open: 1.0
  closed: 0.0
