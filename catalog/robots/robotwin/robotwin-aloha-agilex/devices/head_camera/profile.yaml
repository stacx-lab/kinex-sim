  ready_timeout_s: 30
operations:
  image:
    description: rgb8 images stamped at acquisition in optical frame head_camera/base.
    transport: topic
    direction: output
    endpoint: /head_camera/image
    type: sensor_msgs/msg/Image
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  depth:
    description: 16UC1 depth registered to image, in millimetres, with the image's stamp; 0 marks missing samples.
    transport: topic
    direction: output
    endpoint: /head_camera/depth
    type: sensor_msgs/msg/Image
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  camera_info:
    description: CameraInfo mirroring the profile's color geometry.
    transport: topic
    direction: output
    endpoint: /head_camera/camera_info
    type: sensor_msgs/msg/CameraInfo
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
