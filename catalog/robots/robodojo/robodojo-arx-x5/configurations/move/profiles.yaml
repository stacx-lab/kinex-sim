left_arm:
  operations:
    joint_target: null
    move:
      description: 'Move the flange in straight lines through poses at the arm''s own pace:
        multi_dof_trajectory with joint_names [flange] and one transform per point, in left_arm/base
        (metres, unit quaternion xyzw). A zero time_from_start moves at up to 1 m/s and 3.3
        rad/s; a later one moves slower. It succeeds within 0.005 m and 0.05 rad of the last
        pose, or within component_goal_tolerance (joint_name flange; component 4 metres, 5
        radians). It aborts where the arm is when the flange stalls, is still short 1 s (or
        goal_time_tolerance) after the motion should end, or has no IK solution. Result error_code:
        0 reached, -4 stalled, -5 late, -1 otherwise; error_string says why and how far from
        the goal. A newer goal or a stop ends it.'
      transport: action
      direction: input
      endpoint: /left_arm/move
      type: control_msgs/action/FollowJointTrajectory
      qos:
        depth: 1
        reliability: reliable
        durability: volatile
      timeout_s: 10
  description: ARX X5 six-joint left arm, moved by flange goals through its own IK.
