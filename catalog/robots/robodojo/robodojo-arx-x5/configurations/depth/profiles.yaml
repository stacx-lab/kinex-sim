left_camera:
  layout: null
  operations:
    depth:
      description: 16UC1 depth registered to image, in millimetres, with the image's stamp;
        0 marks missing samples.
      transport: topic
      direction: output
      endpoint: /left_camera/depth
      type: sensor_msgs/msg/Image
      qos:
        depth: 1
        reliability: reliable
        durability: volatile
      timeout_s: 10
  type: rgbd
  description: D435 RGB-D camera on the left wrist.
  depth:
    width: 640
    height: 480
    fps: null
    quantity: z
    scale_m_per_unit: 0.001
    invalid_value: 0
    valid_range_m:
      min: 0.001
      max: 10.0
    reliable_range_m:
      min: 0.001
      max: 10.0
    registration: color
