name: left_gripper
runtime:
  domain_id: 0
  observation: joint_state
  nodes: []
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured grip joint position, a normalized opening, stamped at acquisition.
    transport: topic
    direction: output
    endpoint: /left_gripper/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  stop:
    description: Keep the commanded grip, so a held object stays gripped; before the first
      command, hold the measured opening.
    transport: service
    direction: input
    endpoint: /left_gripper/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  grasp:
    description: 'Close the fingers and keep squeezing: {}, no fields. The goal succeeds once
      the fingers have closed (reached: nothing is between them) or have stopped short (stalled,
      as on an object), and aborts if they are still moving after 24 steps (late) or a step
      moves a TCP more than 0.2 m or 0.8 rad, or that of an arm holding still more than 0.05
      m or 0.25 rad (unsafe_motion). Result: {stop_reason: reached | stalled | late | unsafe_motion
      | ended, opening, steps}, opening as joint_state gives it; feedback: opening and steps.
      A newer goal or a stop ends it.'
    transport: action
    direction: input
    endpoint: /left_gripper/grasp
    type: custom_interfaces/action/Json
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  release:
    description: 'Open the fingers: {opening}, a grip joint position, fully open by default.
      The goal succeeds once the opening is reached and aborts when the fingers stall, are
      still moving after 24 steps (late) or a step is unsafe as for grasp. Result and feedback:
      as grasp''s. A newer goal or a stop ends it.'
    transport: action
    direction: input
    endpoint: /left_gripper/release
    type: custom_interfaces/action/Json
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: true
meta:
  created_at: '2026-10-24T00:00:00Z'
  updated_at: '2026-10-24T00:00:00Z'
type: gripper
description: ARX X5 left parallel two-finger gripper. A closed grip squeezes past the finger
  stop. The TCP is the pad centre and approaches along +x.
source: introspected
calibrated_at: null
method: introspection
stop:
  behavior: hold
  affected_devices:
  - left_gripper
frames:
  base:
    translation_m:
    - 0.0
    - 0.0
    - 0.0
    rotation_xyzw:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
    parent: left_arm:flange
  tcp:
    translation_m:
    - 0.15007
    - -2.0e-06
    - -0.00144
    rotation_xyzw:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
    parent: left_gripper:base
model:
  format: urdf
  path: gripper.urdf
  base_link: base_link
grip:
  joint: left_gripper
  open: 1.0
  closed: 0.0
