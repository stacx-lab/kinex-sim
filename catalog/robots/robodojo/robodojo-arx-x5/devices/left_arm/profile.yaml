name: left_arm
runtime:
  domain_id: 0
  nodes: []
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured joint positions and velocities in URDF units, stamped at acquisition.
    transport: topic
    direction: output
    endpoint: /left_arm/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  pose_state:
    description: Measured flange pose in left_arm/base, stamped with joint_state.
    transport: topic
    direction: output
    endpoint: /left_arm/pose_state
    type: sensor_msgs/msg/MultiDOFJointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  stop:
    description: Stop motion and hold the measured posture.
    transport: service
    direction: input
    endpoint: /left_arm/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  move:
    description: 'Move the flange in a straight line to a pose: {pose: [x, y, z, qx, qy, qz,
      qw] in left_arm/base, profile}. profile is the gear, the most a 0.04 s step moves the
      flange and how near the pose it has reached it: standard 4 cm within 0.03 m and 0.1
      rad, approach 4 cm within 0.02 m and 0.05 rad, precision 1 cm within 0.005 m and 0.05
      rad; standard by default. The goal aborts when the flange stalls, moves away from the
      pose on two steps running (diverging), when a step moves a flange more than 0.2 m or
      0.8 rad, or that of an arm holding still more than 0.05 m or 0.25 rad (unsafe_motion),
      when a step has no IK solution (unreachable) or 25 steps after the gear would have arrived
      (late). Before it is unreachable the flange goes, once, for a pose the arm can reach
      within the gear''s tolerance of the goal''s, if there is one. Result: {stop_reason:
      reached | stalled | diverging | unsafe_motion | unreachable | late | ended, pose, position_error_m,
      orientation_error_rad, steps, recovered: whether it went for such a pose}; feedback:
      the errors and steps. A newer goal or a stop ends it.'
    transport: action
    direction: input
    endpoint: /left_arm/move
    type: custom_interfaces/action/Json
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
