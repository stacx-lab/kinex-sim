name: right_arm
runtime:
  domain_id: 0
  nodes: []
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured joint positions and velocities in URDF units, stamped at acquisition.
    transport: topic
    direction: output
    endpoint: /right_arm/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  pose_state:
    description: Measured flange pose in right_arm/base, stamped with joint_state.
    transport: topic
    direction: output
    endpoint: /right_arm/pose_state
    type: sensor_msgs/msg/MultiDOFJointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  stop:
    description: Stop motion and hold the measured posture.
    transport: service
    direction: input
    endpoint: /right_arm/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  move:
    description: 'Move right_gripper/tcp in a straight line to a pose: {pose: [x, y, z, qx, qy, qz, qw] of right_gripper/tcp in right_arm/base, profile, position_tolerance_m, orientation_tolerance_rad, max_steps}. profile is the gear, the most a 0.04 s step moves the TCP and how near the pose it has reached it: standard 4 cm within 0.03 m and 0.1 rad, approach 4 cm within 0.02 m and 0.05 rad, precision 1 cm within 0.005 m and 0.05 rad; standard by default. A turn about the TCP takes part of the step: it sweeps the flange, 0.150 m away, at most half the step. position_tolerance_m (0.001 to 0.1) and orientation_tolerance_rad (0.02 to 0.5) replace the gear''s tolerances. max_steps (1 to 24, 24 by default) bounds the goal''s steps. The goal succeeds once the TCP is within the tolerance of the pose (reached) or has taken max_steps steps (max_steps, the result''s errors saying how far it is from the pose), and aborts when the TCP stalls, moves away from the pose on two steps running (diverging), when a step moves a TCP more than 0.2 m or 0.8 rad, or that of an arm holding still more than 0.05 m or 0.25 rad (unsafe_motion) or when a step has no IK solution (unreachable). Before it is unreachable the TCP goes, once, for a pose the arm can reach within the tolerance of the goal''s, if there is one. Result: {stop_reason: reached | stalled | diverging | unsafe_motion | unreachable | max_steps | ended, pose of the TCP, position_error_m, orientation_error_rad, steps, recovered: whether it went for such a pose}; feedback: the errors and steps. A newer goal or a stop ends it.'
    transport: action
    direction: input
    endpoint: /right_arm/move
    type: custom_interfaces/action/Json
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: true
