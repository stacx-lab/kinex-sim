name: right_hand
runtime:
  domain_id: 0
  nodes: []
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured joint positions and velocities in URDF units, stamped at acquisition.
    transport: topic
    direction: output
    endpoint: /right_hand/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  joint_target:
    description: Position trajectory naming every joint once, without velocities, accelerations
      or effort, with strictly increasing time_from_start ending within 120 s. It starts on
      receipt, or at a nonzero header stamp not in the past, runs linearly from the current
      target and replaces the active command. One that is malformed or leaves the joint limits
      is refused, which the world's next wait reply reports.
    transport: topic
    direction: input
    endpoint: /right_hand/joint_target
    type: trajectory_msgs/msg/JointTrajectory
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  stop:
    description: Stop motion and hold the measured posture.
    transport: service
    direction: input
    endpoint: /right_hand/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
