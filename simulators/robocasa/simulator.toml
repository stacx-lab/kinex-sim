name = "robocasa"
source = "third_party/robocasa"
source_url = "https://github.com/robocasa/robocasa.git"
source_revision = "456174f62b89b8fca99eaaf33949c29fec9cfc2a"
patches = "patches/robocasa"
python_path = "simulators/robocasa"
asset_preparer = "kinex_sim_robocasa.assets:prepare"
asset_checker = "kinex_sim_robocasa.assets:check_task"
default_task = "PickPlaceCounterToCabinet"
ros_package = "kinex_sim_robocasa"
environment = "robocasa"
task_catalog = "tasks.toml"
# Upstream's own scene arguments, which launch passes to reset: create_env's split preset, and layout and style ids
# that override the split's kitchens. The seed selects the rest as upstream's does.
scene_options = ["split", "layout_id", "style_id"]

# RoboCasa365 requires robosuite 1.5.2; the pinned upstream is exported beside it.
[[nested_sources]]
path = "robosuite"
source = "third_party/robocasa-robosuite"
source_url = "https://github.com/ARISE-Initiative/robosuite"
source_revision = "5ce6643f3092639d08f7b0f90ed1c6a84f50552c"
install = ["."]

# The backend's device inventory; catalog rigs must declare exactly these devices.
[devices]
base = "locomotion"
torso = "joint"
arm = "joint"
gripper = "gripper"
camera_left = "rgb"
camera_right = "rgb"
camera_wrist = "rgb"

# Alternative device sets: setup, launch and demo select one with --config NAME (default: [devices] above).
# devices overrides kinds in [devices]; each rig holds configurations/NAME/ with its profile changes
# (profiles.yaml); the backend takes configuration=NAME.
[configurations.basic]
description = "RGB-D cameras, and absolute joint targets for the arm and torso, which robosuite's JOINT_POSITION controller executes in place of upstream's OSC_POSE and delta torso"
devices = { camera_left = "rgbd", camera_right = "rgbd", camera_wrist = "rgbd" }  # the arm stays a joint device
