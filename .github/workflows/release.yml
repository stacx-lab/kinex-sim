name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag against VERSION
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ffmpeg, which the recording tests encode and decode with
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install -e ".[dev]"
      - name: Check the installed version and CLI
        run: |
          test "$(python -c 'from importlib.metadata import version; print(version("kinex-sim"))')" = "$(cat VERSION)"
          kinex-sim --help
      - run: python -m pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
